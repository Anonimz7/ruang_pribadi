<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Password - Super App</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .password-display {
            font-family: 'Courier New', monospace;
            font-size: 1.5rem;
            padding: var(--spacing-lg);
            background: var(--bg-body);
            border-radius: var(--border-radius);
            border: 2px solid var(--border-color);
            text-align: center;
            word-break: break-all;
            margin-bottom: var(--spacing-md);
        }
        
        .strength-meter {
            height: 8px;
            background: var(--border-color);
            border-radius: 4px;
            overflow: hidden;
            margin-top: var(--spacing-sm);
        }
        
        .strength-fill {
            height: 100%;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <svg class="sidebar-logo" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                <span class="sidebar-title">Super App</span>
            </div>
            <nav class="sidebar-nav">
                <a href="/index.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>Dashboard</a>
                <a href="/pages/password.html" class="nav-item active"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2z"/></svg>Generator Password</a>
                <a href="/pages/quiz.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>Kuis Matematika</a>
                <a href="/pages/gacha.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg>Gacha</a>
                <a href="/pages/translator.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7v2H4v2h1.54C6.32 9.36 8.5 11.59 11.5 13.31L8.93 15.87 10.34 17.28l2.53-2.53v.32z"/></svg>Penerjemah</a>
                <a href="/pages/settings.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>Pengaturan</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <h1 class="header-title">Generator Password</h1>
                <button class="btn-icon" id="themeToggle"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M9 21c-4.97 0-9-4.03-9-9s4.03-9 9-9c.83 0 1.64.11 2.41.32C5.09 14.09 6.23 18.17 9 21z"/></svg></button>
            </header>

            <div class="card">
                <div class="password-display" id="passwordDisplay">Klik "Generate" untuk membuat password</div>
                
                <div class="strength-meter">
                    <div class="strength-fill" id="strengthFill" style="width: 0%; background: var(--danger);"></div>
                </div>
                <div class="flex justify-between mt-1">
                    <span style="font-size: 0.75rem; color: var(--text-secondary);" id="strengthLabel">-</span>
                    <span style="font-size: 0.75rem; color: var(--text-secondary);" id="lengthLabel">0 karakter</span>
                </div>

                <div class="flex gap-2 mt-2">
                    <button class="btn btn-primary" id="generateBtn" style="flex: 1;">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                        Generate
                    </button>
                    <button class="btn btn-secondary" id="copyBtn">
                        <svg class="nav-icon" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                        Salin
                    </button>
                </div>

                <div class="grid grid-2 mt-2">
                    <div class="form-group">
                        <label class="form-label">Panjang Password</label>
                        <input type="range" class="form-input" id="lengthSlider" min="6" max="32" value="16" 
                               style="padding: 0; height: 8px;">
                        <div style="text-align: right; font-size: 0.875rem; color: var(--text-secondary);">
                            <span id="lengthValue">16</span> karakter
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Opsi</label>
                        <div style="display: flex; flex-direction: column; gap: var(--spacing-xs);">
                            <label><input type="checkbox" id="includeUppercase" checked> Huruf Besar (A-Z)</label>
                            <label><input type="checkbox" id="includeLowercase" checked> Huruf Kecil (a-z)</label>
                            <label><input type="checkbox" id="includeNumbers" checked> Angka (0-9)</label>
                            <label><input type="checkbox" id="includeSymbols" checked> Simbol (!@#$%)</label>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="toast-container"></div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/storage.js"></script>
    <script src="/js/ui.js"></script>
    <script>
        if (!auth.isAuthenticated()) window.location.href = '/login.html';
        storage.initTheme();

        const chars = {
            uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
            lowercase: 'abcdefghijklmnopqrstuvwxyz',
            numbers: '0123456789',
            symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
        };

        document.getElementById('themeToggle').addEventListener('click', () => storage.toggleDarkMode());
        
        document.getElementById('lengthSlider').addEventListener('input', (e) => {
            document.getElementById('lengthValue').textContent = e.target.value;
            document.getElementById('lengthLabel').textContent = `${e.target.value} karakter`;
        });

        document.getElementById('generateBtn').addEventListener('click', generatePassword);
        
        document.getElementById('copyBtn').addEventListener('click', () => {
            const password = document.getElementById('passwordDisplay').textContent;
            if (password && password !== 'Klik "Generate" untuk membuat password') {
                ui.copyToClipboard(password);
            }
        });

        function generatePassword() {
            const length = parseInt(document.getElementById('lengthSlider').value);
            const useUpper = document.getElementById('includeUppercase').checked;
            const useLower = document.getElementById('includeLowercase').checked;
            const useNumbers = document.getElementById('includeNumbers').checked;
            const useSymbols = document.getElementById('includeSymbols').checked;

            let charSet = '';
            if (useUpper) charSet += chars.uppercase;
            if (useLower) charSet += chars.lowercase;
            if (useNumbers) charSet += chars.numbers;
            if (useSymbols) charSet += chars.symbols;

            if (charSet === '') {
                ui.showToast('Pilih minimal satu opsi karakter', 'warning');
                return;
            }

            let password = '';
            const array = new Uint32Array(length);
            crypto.getRandomValues(array);

            for (let i = 0; i < length; i++) {
                password += charSet[array[i] % charSet.length];
            }

            document.getElementById('passwordDisplay').textContent = password;
            document.getElementById('lengthLabel').textContent = `${password.length} karakter`;
            
            // Update strength
            const strength = ui.getPasswordStrength(password);
            const strengthFill = document.getElementById('strengthFill');
            const strengthLabel = document.getElementById('strengthLabel');
            
            const colors = ['#ef4444', '#ef4444', '#f59e0b', '#10b981', '#10b981'];
            const width = [20, 40, 60, 80, 100];
            
            strengthFill.style.width = `${width[strength.score]}%`;
            strengthFill.style.background = colors[strength.score];
            strengthLabel.textContent = strength.label;
            strengthLabel.style.color = colors[strength.score];

            ui.showToast('Password berhasil dibuat', 'success');
        }

        // Generate on load
        generatePassword();
    </script>
</body>
</html>
